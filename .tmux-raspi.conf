# デフォルトのプレフィクス Ctrl-B を解除
unbind C-b

# プレフィクスを Ctrl-J に変更
set-option -g prefix C-j
bind-key C-j send-prefix

# Raspberry Pi カラーのステータスバー
set-option -g status-style "fg=#f5f5f5,bg=#222222"
set-option -g status-left-style "fg=#ffffff,bg=#c51a4a,bold"
set-option -g status-right-style "fg=#ffffff,bg=#6cc04a,bold"

# ウィンドウ一覧
set-window-option -g window-status-style "fg=#bdbdbd,bg=#222222"
set-window-option -g window-status-current-style "fg=#ffffff,bg=#c51a4a,bold"

# ペイン境界線
set-option -g pane-border-style "fg=#4a4a4a"
set-option -g pane-active-border-style "fg=#6cc04a"
